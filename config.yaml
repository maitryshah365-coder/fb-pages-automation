# Google Drive to Facebook Pages Automation Configuration
# Master Spec - Page Group Configuration for 6 Facebook Pages

page_group: "personal_fb_id_1"
ai_disclosure_status: "pending_determination"  # Options: api_flag, embedded_metadata, unresolved_recorded

database:
  path: "data/posted_videos.db"

retry:
  max_attempts: 3
  base_delay_seconds: 5
  max_delay_seconds: 60

notifications:
  discord_enabled: false
  discord_webhook_url: ""  # Can be set via DISCORD_WEBHOOK_URL env var/secret

# List of 6 Facebook Pages sharing this Page Group (Single Personal FB Admin)
pages:
  - page_id: "REPLACE_WITH_FB_PAGE_ID_1"
    name: "page_1"
    enabled: true
    drive_folder_id: "REPLACE_WITH_PAGE_1_DRIVE_FOLDER_ID"
    daily_limit: 2
    title_mode: "filename"  # Options: filename, fixed
    description_footer: ""
    default_hashtags: []

  - page_id: "REPLACE_WITH_FB_PAGE_ID_2"
