name: UK London Facebook Infographics Pipeline (Anti-Collision 6 Slots)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no actual Facebook POST)"
        required: false
        type: boolean
        default: false
      page:
        description: "Optional: Specific UK page name or ID to run"
        required: false
        type: string
        default: ""
      slot:
        description: "Optional: Specific slot index (0 to 5)"
        required: false
        type: string
        default: ""

  # Scheduled 6 Times Daily (Guaranteed ZERO Collision with UK London Reels):
  # Slot 0: 02:30 UTC (08:00 AM IST / 03:30 AM London) -> 330m buffer before UK Reels W1 (08:00 UTC)
  # Slot 1: 06:00 UTC (11:30 AM IST / 07:00 AM London) -> 120m buffer before UK Reels W1
  # Slot 2: 10:15 UTC (03:45 PM IST / 11:15 AM London) -> 55m buffer after UK Reels W1, 105m before W2
  # Slot 3: 14:15 UTC (07:45 PM IST / 03:15 PM London) -> 55m buffer after UK Reels W2, 105m before W3
  # Slot 4: 18:15 UTC (11:45 PM IST / 07:15 PM London) -> 55m buffer after UK Reels W3, 135m before W4
  # Slot 5: 22:30 UTC (04:00 AM IST / 11:30 PM London) -> 40m buffer after UK Reels W4
  schedule:
    - cron: "30 2 * * *"
    - cron: "0 6 * * *"
    - cron: "15 10 * * *"
    - cron: "15 14 * * *"
    - cron: "15 18 * * *"
    - cron: "30 22 * * *"

concurrency:
  group: uk-infographics-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  execute-uk-infographics:
    name: Execute UK Fleet Infographic Publishing (81 Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Fonts, Playwright Chromium & WireGuard VPN
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-freefont-ttf wireguard wireguard-tools resolvconf curl jq
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Connect Surfshark UK VPN & Execute UK Infographics Wave
        run: |
          ARGS="--live"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          if [ -n "${{ github.event.inputs.page }}" ]; then
            ARGS="$ARGS --page '${{ github.event.inputs.page }}'"
          fi
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            ARGS="$ARGS --slot ${{ github.event.inputs.slot }}"
          fi

          echo "🔒 Connecting to Dedicated Surfshark UK London VPN Tunnel..."
          chmod +x scripts/connect_wireguard_uk.sh
          ./scripts/connect_wireguard_uk.sh "london" || true

          echo "🚀 Executing UK Fleet Infographics (81 Pages)..."
          python scripts/run_infographics.py $ARGS --fleet uk --require-uk || true

          echo "🔌 Disconnecting UK VPN Tunnel..."
          sudo wg-quick down wg0 2>/dev/null || true

      - name: Persist SQLite Database & Infographic State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ docs/data/ web/data/
          if [ -n "$(git status --porcelain data/ docs/data/ web/data/)" ]; then
            git commit -m "chore(uk): persist automated infographic uploads & ledger [skip ci]"
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase -X theirs origin/main && git push origin main && break || {
                git rebase --abort 2>/dev/null || true
                sleep 5
              }
            done
          else
            echo "No state changes to commit."
          fi

      - name: Upload Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uk-infographic-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14

