name: UK London Facebook Automation Pipeline

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no actual Facebook post)"
        required: false
        type: boolean
        default: false
      page:
        description: "Optional: Specific UK page name or group (e.g. uk_account_1, uk_account_2, uk_account_3, uk_account_4, uk_account_5)"
        required: false
        type: string
        default: ""

  push:
    paths:
      - '.triggers/run_uk.trigger'
      - '.triggers/run_all.trigger'

  # Scheduled 4 times daily across True London Audience Peaks (BST / GMT / UTC):
  # Slot 1 (Morning Commute UK): 7:00 AM - 9:00 AM London (07:00 - 09:00 UTC)
  # Slot 2 (Lunchtime UK): 12:00 PM - 2:00 PM London (12:00 - 14:00 UTC)
  # Slot 3 (After-Work Peak UK): 5:00 PM - 7:00 PM London (17:00 - 19:00 UTC)
  # Slot 4 (Night / Bedtime UK): 9:00 PM - 11:00 PM London (21:00 - 23:00 UTC)
  # Staggered 12-min intervals: :01, :13, :25, :37, :49 (Zero collision with USA's :07, :27, :47)
  schedule:
    - cron: "1 7,12,17,21 * * *"   # UK Account 1 (Binjal Mehra)
    - cron: "13 7,12,17,21 * * *"  # UK Account 2 (Chanda Nai - Staggered +12 Min)
    - cron: "25 7,12,17,21 * * *"  # UK Account 3 (Mahi Patel - Staggered +24 Min)
    - cron: "37 7,12,17,21 * * *"  # UK Account 4 (Nidhi Desai - Staggered +36 Min)
    - cron: "49 7,12,17,21 * * *"  # UK Account 5 (Richi Patel - Staggered +48 Min)
    - cron: "1 8,13,18,22 * * *"   # UK Account 6 (Sweta Shah - Staggered +60 Min)
    - cron: "13 8,13,18,22 * * *"  # UK Account 7 (Riya Gaur - Staggered +72 Min)

concurrency:
  group: uk-facebook-upload-${{ github.event.inputs.page || github.event.schedule || 'default' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload-uk:
    name: Execute UK London Post Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies & WireGuard
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard resolvconf curl jq

      - name: Install Python Automation Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Target Account & Regional Profile
        id: target_meta
        run: |
          TARGET_LOC="london"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "1 8,13,18,22 * * *" ]; then
              TARGET_LOC="sweta_wales"
            fi
          elif [ "${{ github.event.inputs.page }}" = "uk_account_6" ] || [ "${{ github.event.inputs.page }}" = "uk6" ]; then
            TARGET_LOC="sweta_wales"
          fi
          echo "target_loc=$TARGET_LOC" >> $GITHUB_OUTPUT

      - name: Connect Surfshark UK WireGuard & Enforce Kill-Switch
        run: |
          chmod +x scripts/connect_wireguard_uk.sh
          ./scripts/connect_wireguard_uk.sh "${{ steps.target_meta.outputs.target_loc }}"

      - name: Execute Multi-Page UK Automation Pipeline
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_USER_ACCESS_TOKEN_2: ${{ secrets.FB_USER_ACCESS_TOKEN_2 }}
          REQUIRE_UK_IP: "true"
        run: |
          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "13 8,13,18,22 * * *" ]; then
              echo "⏰ UK Account 7 Cron Triggered: Running UK Account 7 (Riya Gaur - 12 Pages) [+72 Min Offset]"
              python main.py --config config_uk_account7.yaml $DRY_ARG --require-uk
            elif [ "${{ github.event.schedule }}" = "1 8,13,18,22 * * *" ]; then
              echo "⏰ UK Account 6 Cron Triggered: Running UK Account 6 (Sweta Shah - 12 Pages) [+60 Min Offset]"
              python main.py --config config_uk_account6.yaml $DRY_ARG --require-uk
            elif [ "${{ github.event.schedule }}" = "49 7,12,17,21 * * *" ]; then
              echo "⏰ UK Account 5 Cron Triggered: Running UK Account 5 (Richi Patel - 11 Pages) [+48 Min Offset]"
              python main.py --config config_uk_account5.yaml $DRY_ARG --require-uk
            elif [ "${{ github.event.schedule }}" = "37 7,12,17,21 * * *" ]; then
              echo "⏰ UK Account 4 Cron Triggered: Running UK Account 4 (Nidhi Desai - 12 Pages) [+36 Min Offset]"
              python main.py --config config_uk_account4.yaml $DRY_ARG --require-uk
            elif [ "${{ github.event.schedule }}" = "25 7,12,17,21 * * *" ]; then
              echo "⏰ UK Account 3 Cron Triggered: Running UK Account 3 (Mahi Patel - 12 Pages) [+24 Min Offset]"
              python main.py --config config_uk_account3.yaml $DRY_ARG --require-uk
            elif [ "${{ github.event.schedule }}" = "13 7,12,17,21 * * *" ]; then
              echo "⏰ UK Account 2 Cron Triggered: Running UK Account 2 (Chanda Nai - 12 Pages) [+12 Min Offset]"
              python main.py --config config_uk_account2.yaml $DRY_ARG --require-uk
            else
              echo "⏰ UK Account 1 Cron Triggered: Running UK Account 1 (Binjal Mehra - 12 Pages)"
              python main.py --config config_uk_account1.yaml $DRY_ARG --require-uk
            fi
          elif [ -n "${{ github.event.inputs.page }}" ]; then
            REQ_PAGE="${{ github.event.inputs.page }}"
            echo "📋 Dispatched UK Execution Request: $REQ_PAGE"
            python scripts/run_uk_pages.py "$REQ_PAGE" $DRY_ARG
          else
            python main.py --config config_uk_account1.yaml $DRY_ARG --require-uk
            python main.py --config config_uk_account2.yaml $DRY_ARG --require-uk
            python main.py --config config_uk_account3.yaml $DRY_ARG --require-uk
            python main.py --config config_uk_account4.yaml $DRY_ARG --require-uk
            python main.py --config config_uk_account5.yaml $DRY_ARG --require-uk
            python main.py --config config_uk_account6.yaml $DRY_ARG --require-uk
            python main.py --config config_uk_account7.yaml $DRY_ARG --require-uk
          fi

      - name: Disconnect WireGuard Tunnel
        if: always()
        run: |
          sudo wg-quick down wg0 || true

      - name: Sync Live Dashboard Data
        if: always()
        run: |
          python scripts/sync_dashboard_data.py || true

      - name: Persist Database & State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: update UK automation state [skip ci]" || true
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase -X theirs origin/main && git push origin main && break || {
                git rebase --abort 2>/dev/null || true
                sleep 5
              }
            done
          fi
