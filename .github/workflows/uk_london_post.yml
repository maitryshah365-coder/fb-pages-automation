name: UK London Facebook Automation Pipeline

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no actual Facebook post)"
        required: false
        type: boolean
        default: false
      page:
        description: "Optional: Specific UK page name or group (e.g. uk_account_1, uk_account_2, uk_account_3)"
        required: false
        type: string
        default: ""

  # Scheduled 4 times daily (London Time BST / UTC):
  # UK Account 1 (Pages 31-42): 09:00 AM, 01:00 PM, 05:00 PM, 09:30 PM London (08:00, 12:00, 16:00, 20:30 UTC)
  # UK Account 2 (Pages 43-54): +20 Min Offset (09:20 AM, 01:20 PM, 05:20 PM, 09:50 PM London - 08:20, 12:20, 16:20, 20:50 UTC)
  # UK Account 3 (Pages 55-66): +30 Min Offset (09:30 AM, 01:30 PM, 05:30 PM, 10:00 PM London - 08:30, 12:30, 16:30, 21:00 UTC)
  schedule:
    # UK Account 1 (Binjal Mehra):
    - cron: "0 8,12,16 * * *"
    - cron: "30 20 * * *"
    # UK Account 2 (Chanda Nai - Staggered +20 Min Offset):
    - cron: "20 8,12,16 * * *"
    - cron: "50 20 * * *"
    # UK Account 3 (Mahi Patel - Staggered +30 Min Offset):
    - cron: "30 8,12,16 * * *"
    - cron: "0 21 * * *"

concurrency:
  group: uk-facebook-upload-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload-uk:
    name: Execute UK London Post Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Utilities & FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Connect Surfshark London WireGuard & Enforce UK Kill-Switch
        run: |
          chmod +x scripts/connect_wireguard_uk.sh
          ./scripts/connect_wireguard_uk.sh

      - name: Run UK Automation Engine
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_OWNER_REFRESH_TOKEN: ${{ secrets.GDRIVE_OWNER_REFRESH_TOKEN }}
          GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_USER_ACCESS_TOKEN_2: ${{ secrets.FB_USER_ACCESS_TOKEN_2 }}
          REQUIRE_UK_IP: "true"
        run: |
          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "30 8,12,16 * * *" ] || [ "${{ github.event.schedule }}" = "0 21 * * *" ]; then
              echo "⏰ UK Account 3 Cron Triggered: Running UK Account 3 (Mahi Patel - 12 Pages) [+30 Min Offset]"
              python main.py --config config_uk_account3.yaml $DRY_ARG --require-uk
            elif [ "${{ github.event.schedule }}" = "20 8,12,16 * * *" ] || [ "${{ github.event.schedule }}" = "50 20 * * *" ]; then
              echo "⏰ UK Account 2 Cron Triggered: Running UK Account 2 (Chanda Nai - 12 Pages) [+20 Min Offset]"
              python main.py --config config_uk_account2.yaml $DRY_ARG --require-uk
            else
              echo "⏰ UK Account 1 Cron Triggered: Running UK Account 1 (Binjal Mehra - 12 Pages)"
              python main.py --config config_uk_account1.yaml $DRY_ARG --require-uk
            fi
          elif [ -n "${{ github.event.inputs.page }}" ]; then
            REQ_PAGE="${{ github.event.inputs.page }}"
            if [ "$REQ_PAGE" = "uk_account_1" ] || [ "$REQ_PAGE" = "uk1" ]; then
              python main.py --config config_uk_account1.yaml $DRY_ARG --require-uk
            elif [ "$REQ_PAGE" = "uk_account_2" ] || [ "$REQ_PAGE" = "uk2" ]; then
              python main.py --config config_uk_account2.yaml $DRY_ARG --require-uk
            elif [ "$REQ_PAGE" = "uk_account_3" ] || [ "$REQ_PAGE" = "uk3" ]; then
              python main.py --config config_uk_account3.yaml $DRY_ARG --require-uk
            elif [[ "$REQ_PAGE" == uk1_page_* ]]; then
              python main.py --config config_uk_account1.yaml --page "$REQ_PAGE" $DRY_ARG --require-uk
            elif [[ "$REQ_PAGE" == uk2_page_* ]]; then
              python main.py --config config_uk_account2.yaml --page "$REQ_PAGE" $DRY_ARG --require-uk
            elif [[ "$REQ_PAGE" == uk3_page_* ]]; then
              python main.py --config config_uk_account3.yaml --page "$REQ_PAGE" $DRY_ARG --require-uk
            else
              python main.py --config config_uk_account1.yaml $DRY_ARG --require-uk
              python main.py --config config_uk_account2.yaml $DRY_ARG --require-uk
              python main.py --config config_uk_account3.yaml $DRY_ARG --require-uk
            fi
          else
            python main.py --config config_uk_account1.yaml $DRY_ARG --require-uk
            python main.py --config config_uk_account2.yaml $DRY_ARG --require-uk
            python main.py --config config_uk_account3.yaml $DRY_ARG --require-uk
          fi

      - name: Disconnect WireGuard Tunnel
        if: always()
        run: |
          sudo wg-quick down wg0 || true

      - name: Sync Live Dashboard Data
        if: always()
        run: |
          python scripts/sync_dashboard_data.py || true

      - name: Persist Database & State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: update UK automation state [skip ci]" || true
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || sleep 5
            done
          fi
