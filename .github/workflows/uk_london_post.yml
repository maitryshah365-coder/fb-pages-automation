name: UK London Facebook Automation Pipeline

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no actual Facebook post)"
        required: false
        type: boolean
        default: false
      page:
        description: "Optional: Specific UK page name or group (e.g. uk_account_1, uk_account_2, uk_account_3, uk_account_4, uk_account_5)"
        required: false
        type: string
        default: ""

  # Scheduled 4 times daily (London Time BST / UTC):
  # UK Account 1 (Pages 31-42): 09:00 AM, 01:00 PM, 05:00 PM, 09:30 PM London (08:00, 12:00, 16:00, 20:30 UTC)
  # UK Account 2 (Pages 43-54): +20 Min Offset (09:20 AM, 01:20 PM, 05:20 PM, 09:50 PM London - 08:20, 12:20, 16:20, 20:50 UTC)
  # UK Account 3 (Pages 55-66): +30 Min Offset (09:30 AM, 01:30 PM, 05:30 PM, 10:00 PM London - 08:30, 12:30, 16:30, 21:00 UTC)
  # UK Account 4 (Pages 67-78): +40 Min Offset (09:40 AM, 01:40 PM, 05:40 PM, 10:10 PM London - 08:40, 12:40, 16:40, 21:10 UTC)
  # UK Account 5 (Pages 79-89): +50 Min Offset (09:50 AM, 01:50 PM, 05:50 PM, 10:20 PM London - 08:50, 12:50, 16:50, 21:20 UTC)
  schedule:
    # UK Account 1 (Binjal Mehra):
    - cron: "0 8,12,16 * * *"
    - cron: "30 20 * * *"
    # UK Account 2 (Chanda Nai - Staggered +20 Min Offset):
    - cron: "20 8,12,16 * * *"
    - cron: "50 20 * * *"
    # UK Account 3 (Mahi Patel - Staggered +30 Min Offset):
    - cron: "30 8,12,16 * * *"
    - cron: "0 21 * * *"
    # UK Account 4 (Nidhi Desai - Staggered +40 Min Offset):
    - cron: "40 8,12,16 * * *"
    - cron: "10 21 * * *"
    # UK Account 5 (Richi Patel - Staggered +50 Min Offset):
    - cron: "50 8,12,16 * * *"
    - cron: "20 21 * * *"

concurrency:
  group: uk-facebook-upload-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload-uk:
    name: Execute UK London Post Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies & WireGuard
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard resolvconf curl jq

      - name: Install Python Automation Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Connect Surfshark London WireGuard & Enforce UK Kill-Switch
        run: |
          chmod +x scripts/connect_wireguard_uk.sh
          ./scripts/connect_wireguard_uk.sh

      - name: Execute Multi-Page UK Automation Pipeline
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_USER_ACCESS_TOKEN_2: ${{ secrets.FB_USER_ACCESS_TOKEN_2 }}
          REQUIRE_UK_IP: "true"
        run: |
          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "50 8,12,16 * * *" ] || [ "${{ github.event.schedule }}" = "20 21 * * *" ]; then
              echo "⏰ UK Account 5 Cron Triggered: Running UK Account 5 (Richi Patel - 11 Pages) [+50 Min Offset]"
              python main.py --config config_uk_account5.yaml $DRY_ARG --require-uk
            elif [ "${{ github.event.schedule }}" = "40 8,12,16 * * *" ] || [ "${{ github.event.schedule }}" = "10 21 * * *" ]; then
              echo "⏰ UK Account 4 Cron Triggered: Running UK Account 4 (Nidhi Desai - 12 Pages) [+40 Min Offset]"
              python main.py --config config_uk_account4.yaml $DRY_ARG --require-uk
            elif [ "${{ github.event.schedule }}" = "30 8,12,16 * * *" ] || [ "${{ github.event.schedule }}" = "0 21 * * *" ]; then
              echo "⏰ UK Account 3 Cron Triggered: Running UK Account 3 (Mahi Patel - 12 Pages) [+30 Min Offset]"
              python main.py --config config_uk_account3.yaml $DRY_ARG --require-uk
            elif [ "${{ github.event.schedule }}" = "20 8,12,16 * * *" ] || [ "${{ github.event.schedule }}" = "50 20 * * *" ]; then
              echo "⏰ UK Account 2 Cron Triggered: Running UK Account 2 (Chanda Nai - 12 Pages) [+20 Min Offset]"
              python main.py --config config_uk_account2.yaml $DRY_ARG --require-uk
            else
              echo "⏰ UK Account 1 Cron Triggered: Running UK Account 1 (Binjal Mehra - 12 Pages)"
              python main.py --config config_uk_account1.yaml $DRY_ARG --require-uk
            fi
          elif [ -n "${{ github.event.inputs.page }}" ]; then
            REQ_PAGE="${{ github.event.inputs.page }}"
            echo "📋 Dispatched UK Execution Request: $REQ_PAGE"
            python scripts/run_uk_pages.py "$REQ_PAGE" $DRY_ARG
          else
            python main.py --config config_uk_account1.yaml $DRY_ARG --require-uk
            python main.py --config config_uk_account2.yaml $DRY_ARG --require-uk
            python main.py --config config_uk_account3.yaml $DRY_ARG --require-uk
            python main.py --config config_uk_account4.yaml $DRY_ARG --require-uk
            python main.py --config config_uk_account5.yaml $DRY_ARG --require-uk
          fi

      - name: Disconnect WireGuard Tunnel
        if: always()
        run: |
          sudo wg-quick down wg0 || true

      - name: Sync Live Dashboard Data
        if: always()
        run: |
          python scripts/sync_dashboard_data.py || true

      - name: Persist Database & State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: update UK automation state [skip ci]" || true
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || sleep 5
            done
          fi
