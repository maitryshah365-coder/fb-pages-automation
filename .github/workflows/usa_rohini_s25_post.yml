name: USA Account 4 (Rohini Dutt - Samsung S25) 24/7 Automation Pipeline

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no actual Facebook post)"
        required: false
        type: boolean
        default: false
      page_name:
        description: "Optional: Specific page name to run (leave empty for all 15)"
        required: false
        type: string
        default: ""

  push:
    paths:
      - '.triggers/run_rohini.trigger'
      - '.triggers/run_all.trigger'

  # Scheduled 4 times daily (USA Times EDT - Staggered Slot):
  # Slot 1: 11:00 AM EDT (03:00 UTC)
  # Slot 2: 04:00 PM EDT (20:00 UTC)
  # Slot 3: 08:00 PM EDT (00:00 UTC next day)
  # Slot 4: 11:00 PM EDT (03:00 UTC)
  schedule:
    - cron: "0 3,15,20,0 * * *"

concurrency:
  group: rohini-s25-upload-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload:
    name: Execute Rohini Dutt S25 Automated Reels Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Utilities, FFmpeg & WireGuard
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ffmpeg wireguard wireguard-tools resolvconf jq curl

      - name: Install Dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validate Rohini Dutt Configuration
        run: |
          python scripts/validate_config.py config_usa_account4.yaml

      - name: Connect Surfshark USA New York WireGuard Tunnel
        run: |
          bash scripts/connect_wireguard_usa.sh "new_york"

      - name: Execute Autonomous S25 Reels Publishing
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          ROHINI_S25_COOKIES_JSON: ${{ secrets.ROHINI_S25_COOKIES_JSON }}
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          PAGE_FLAG=""
          if [ -n "${{ github.event.inputs.page_name }}" ]; then
            PAGE_FLAG="--page ${{ github.event.inputs.page_name }}"
          fi
          echo "🚀 Executing 24/7 Cloud Automated Posting for Rohini Dutt (15 Pages)..."
          python scripts/run_rohini_s25_pipeline.py $DRY_FLAG $PAGE_FLAG

      - name: Disconnect WireGuard Tunnel
        if: always()
        run: |
          sudo wg-quick down wg0 2>/dev/null || true

      - name: Update S25 Live Diagnostic & Upload Health State
        if: always()
        run: |
          python scripts/generate_s25_health_data.py

      - name: Persist Database & Dashboard State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/ web/data/
          if [ -n "$(git status --porcelain data/ docs/data/ web/data/)" ]; then
            git commit -m "chore(auto): record Rohini Dutt S25 cloud uploads [skip ci]" || true
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase -X theirs origin/main && git push origin main && break || {
                git rebase --abort 2>/dev/null || true
                sleep 5
              }
            done
          fi
