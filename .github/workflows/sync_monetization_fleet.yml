name: Real Multi-Account Monetization Fleet Cloud Auto-Sync

on:
  schedule:
    # Runs 24/7 automatically in GitHub Actions cloud every 3 hours (Zero PC dependency)
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      account_id:
        description: "Target Account ID to audit (or 'all' for all 12 accounts)"
        required: false
        type: string
        default: "all"
  push:
    paths:
      - '.triggers/sync_monetization.trigger'
      - '.triggers/run_all.trigger'

concurrency:
  group: monetization-sync-group
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit_and_sync:
    name: Execute Real Facebook Playwright Monetization Audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install playwright requests pyyaml
          python -m playwright install --with-deps chromium

      - name: Run Real Facebook Monetization Engine
        run: |
          TARGET_ACC="${{ github.event.inputs.account_id || 'all' }}"
          echo "🚀 Executing Real Live Facebook Audit for target: $TARGET_ACC..."
          python scripts/run_full_fleet_deep_audit.py "$TARGET_ACC"

      - name: Persist Real Live Monetization Data to GitHub
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/master_fleet_monetization.json web/data/master_fleet_monetization.json data/master_fleet_monetization.json data/auto_sync_status.json docs/data/auto_sync_status.json web/data/auto_sync_status.json || true
          if [ -n "$(git status --porcelain docs/data/ web/data/ data/)" ]; then
            git commit -m "chore(monetization): auto-sync real-time Facebook monetization & policy health [skip ci]" || true
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase -X theirs origin/main && git push origin main && break || {
                git rebase --abort 2>/dev/null || true
                sleep 5
              }
            done
            echo "✅ Real monetization data successfully persisted to GitHub & GitHub Pages deployed!"
          else
            echo "No state changes to commit."
          fi
