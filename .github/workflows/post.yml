name: Facebook Pages Automation Pipeline

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no actual Facebook post)"
        required: false
        type: boolean
        default: false
      page:
        description: "Optional: Specific page name to run (leave empty for all)"
        required: false
        type: string
        default: ""

  push:
    paths:
      - '.triggers/run_usa.trigger'
      - '.triggers/run_all.trigger'

  repository_dispatch:
    types: [cron_trigger, fb_post_trigger]

  # Scheduled 4 times daily (USA Times EDT):
  # Account 1 (Pages 1-15): 10:00 AM, 3:00 PM, 7:00 PM, 10:00 PM EDT (02:00, 14:00, 19:00, 23:00 UTC)
  # Account 2 (Pages 16-30): +20 Min Offset (10:20 AM, 3:20 PM, 7:20 PM, 10:20 PM EDT)
  # Account 3 (Pages 31-45 - Radika Patel): +40 Min Offset (10:40 AM, 3:40 PM, 7:40 PM, 10:40 PM EDT)
  schedule:
    - cron: "0 2,14,19,23 * * *"
    - cron: "20 2,14,19,23 * * *"
    - cron: "40 2,14,19,23 * * *"

concurrency:
  group: facebook-upload-${{ github.event.inputs.page || github.event.schedule || 'default' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload:
    name: Execute Facebook Post Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Utilities, FFmpeg & WireGuard
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg wireguard wireguard-tools resolvconf jq

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Configuration
        run: |
          python scripts/validate_config.py config.yaml

      - name: Determine Target USA Account & Regional Profile
        id: select_profile
        run: |
          TARGET_LOC="los_angeles"
          ACCOUNT_NAME="Meghal Chauhan"
          
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "40 2,14,19,23 * * *" ]; then
              TARGET_LOC="new_york"
              ACCOUNT_NAME="Radika Patel"
            elif [ "${{ github.event.schedule }}" = "20 2,14,19,23 * * *" ]; then
              TARGET_LOC="new_york"
              ACCOUNT_NAME="Mia Shah"
            else
              TARGET_LOC="los_angeles"
              ACCOUNT_NAME="Meghal Chauhan"
            fi
          elif [ -n "${{ github.event.inputs.page }}" ]; then
            REQ_PAGE="${{ github.event.inputs.page }}"
            if [ "$REQ_PAGE" = "account_2" ] || [ "$REQ_PAGE" = "usa2" ] || [[ "$REQ_PAGE" == *"page_16"* ]]; then
              TARGET_LOC="new_york"
              ACCOUNT_NAME="Mia Shah"
            elif [ "$REQ_PAGE" = "account_3" ] || [ "$REQ_PAGE" = "usa3" ] || [[ "$REQ_PAGE" == *"page_31"* ]]; then
              TARGET_LOC="new_york"
              ACCOUNT_NAME="Radika Patel"
            else
              TARGET_LOC="los_angeles"
              ACCOUNT_NAME="Meghal Chauhan"
            fi
          fi

          echo "target_loc=$TARGET_LOC" >> "$GITHUB_OUTPUT"
          echo "account_name=$ACCOUNT_NAME" >> "$GITHUB_OUTPUT"
          echo "🎯 TARGET PROFILE IDENTIFIED: $ACCOUNT_NAME -> $TARGET_LOC"

      - name: Connect Surfshark USA WireGuard & Enforce Kill-Switch
        run: |
          bash scripts/connect_wireguard_usa.sh "${{ steps.select_profile.outputs.target_loc }}"

      - name: Run Automation Engine
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_OWNER_REFRESH_TOKEN: ${{ secrets.GDRIVE_OWNER_REFRESH_TOKEN }}
          GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_USER_ACCESS_TOKEN_2: ${{ secrets.FB_USER_ACCESS_TOKEN_2 }}
          FB_TOKEN_PAGE_1: ${{ secrets.FB_TOKEN_PAGE_1 }}
          FB_TOKEN_PAGE_2: ${{ secrets.FB_TOKEN_PAGE_2 }}
          FB_TOKEN_PAGE_3: ${{ secrets.FB_TOKEN_PAGE_3 }}
          FB_TOKEN_PAGE_4: ${{ secrets.FB_TOKEN_PAGE_4 }}
          FB_TOKEN_PAGE_5: ${{ secrets.FB_TOKEN_PAGE_5 }}
          FB_TOKEN_PAGE_6: ${{ secrets.FB_TOKEN_PAGE_6 }}
          FB_TOKEN_PAGE_7: ${{ secrets.FB_TOKEN_PAGE_7 }}
          FB_TOKEN_PAGE_8: ${{ secrets.FB_TOKEN_PAGE_8 }}
          FB_TOKEN_PAGE_9: ${{ secrets.FB_TOKEN_PAGE_9 }}
          FB_TOKEN_PAGE_10: ${{ secrets.FB_TOKEN_PAGE_10 }}
          FB_TOKEN_PAGE_11: ${{ secrets.FB_TOKEN_PAGE_11 }}
          FB_TOKEN_PAGE_12: ${{ secrets.FB_TOKEN_PAGE_12 }}
          FB_TOKEN_PAGE_13: ${{ secrets.FB_TOKEN_PAGE_13 }}
          FB_TOKEN_PAGE_14: ${{ secrets.FB_TOKEN_PAGE_14 }}
          FB_TOKEN_PAGE_15: ${{ secrets.FB_TOKEN_PAGE_15 }}
          FB_TOKEN_PAGE_16: ${{ secrets.FB_TOKEN_PAGE_16 }}
          FB_TOKEN_PAGE_17: ${{ secrets.FB_TOKEN_PAGE_17 }}
          FB_TOKEN_PAGE_18: ${{ secrets.FB_TOKEN_PAGE_18 }}
          FB_TOKEN_PAGE_19: ${{ secrets.FB_TOKEN_PAGE_19 }}
          FB_TOKEN_PAGE_20: ${{ secrets.FB_TOKEN_PAGE_20 }}
          FB_TOKEN_PAGE_21: ${{ secrets.FB_TOKEN_PAGE_21 }}
          FB_TOKEN_PAGE_22: ${{ secrets.FB_TOKEN_PAGE_22 }}
          FB_TOKEN_PAGE_23: ${{ secrets.FB_TOKEN_PAGE_23 }}
          FB_TOKEN_PAGE_24: ${{ secrets.FB_TOKEN_PAGE_24 }}
          FB_TOKEN_PAGE_25: ${{ secrets.FB_TOKEN_PAGE_25 }}
          FB_TOKEN_PAGE_26: ${{ secrets.FB_TOKEN_PAGE_26 }}
          FB_TOKEN_PAGE_27: ${{ secrets.FB_TOKEN_PAGE_27 }}
          FB_TOKEN_PAGE_28: ${{ secrets.FB_TOKEN_PAGE_28 }}
          FB_TOKEN_PAGE_29: ${{ secrets.FB_TOKEN_PAGE_29 }}
          FB_TOKEN_PAGE_30: ${{ secrets.FB_TOKEN_PAGE_30 }}
        run: |
          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "40 2,14,19,23 * * *" ]; then
              echo "⏰ Staggered Cron Triggered: Running Account 3 (Pages 31-45 - Radika Patel) [+40 Min Offset]"
              python main.py --config config.yaml $DRY_ARG --require-us --page "page_31,page_32,page_33,page_34,page_35,page_36,page_37,page_38,page_39,page_40,page_41,page_42,page_43,page_44,page_45"
            elif [ "${{ github.event.schedule }}" = "20 2,14,19,23 * * *" ]; then
              echo "⏰ Staggered Cron Triggered: Running Account 2 (Pages 16-30) [+20 Min Offset]"
              python main.py --config config.yaml $DRY_ARG --require-us --page "page_16,page_17,page_18,page_19,page_20,page_21,page_22,page_23,page_24,page_25,page_26,page_27,page_28,page_29,page_30"
            else
              echo "⏰ Standard Cron Triggered: Running Account 1 (Pages 1-15)"
              python main.py --config config.yaml $DRY_ARG --require-us --page "page_1,page_2,page_3,page_4,page_5,page_6,page_7,page_8,page_9,page_10,page_11,page_12,page_13,page_14,page_15"
            fi
          elif [ -n "${{ github.event.inputs.page }}" ]; then
            REQ_PAGE="${{ github.event.inputs.page }}"
            if [ "$REQ_PAGE" = "account_1" ] || [ "$REQ_PAGE" = "usa1" ]; then
              python main.py --config config.yaml $DRY_ARG --require-us --page "page_1,page_2,page_3,page_4,page_5,page_6,page_7,page_8,page_9,page_10,page_11,page_12,page_13,page_14,page_15"
            elif [ "$REQ_PAGE" = "account_2" ] || [ "$REQ_PAGE" = "usa2" ]; then
              python main.py --config config.yaml $DRY_ARG --require-us --page "page_16,page_17,page_18,page_19,page_20,page_21,page_22,page_23,page_24,page_25,page_26,page_27,page_28,page_29,page_30"
            elif [ "$REQ_PAGE" = "account_3" ] || [ "$REQ_PAGE" = "usa3" ]; then
              python main.py --config config.yaml $DRY_ARG --require-us --page "page_31,page_32,page_33,page_34,page_35,page_36,page_37,page_38,page_39,page_40,page_41,page_42,page_43,page_44,page_45"
            elif [ "$REQ_PAGE" = "all" ]; then
              python main.py --config config.yaml $DRY_ARG --require-us
            else
              python main.py --config config.yaml $DRY_ARG --require-us --page "$REQ_PAGE"
            fi
          else
            python main.py --config config.yaml $DRY_ARG --require-us
          fi

      - name: Disconnect WireGuard Tunnel
        if: always()
        run: |
          sudo wg-quick down wg0 2>/dev/null || true
          echo "WireGuard USA tunnel disconnected successfully."

      - name: Sync Dashboard Data
        if: always()
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_USER_ACCESS_TOKEN_2: ${{ secrets.FB_USER_ACCESS_TOKEN_2 }}
          FB_TOKEN_PAGE_1: ${{ secrets.FB_TOKEN_PAGE_1 }}
          FB_TOKEN_PAGE_2: ${{ secrets.FB_TOKEN_PAGE_2 }}
          FB_TOKEN_PAGE_3: ${{ secrets.FB_TOKEN_PAGE_3 }}
          FB_TOKEN_PAGE_4: ${{ secrets.FB_TOKEN_PAGE_4 }}
          FB_TOKEN_PAGE_5: ${{ secrets.FB_TOKEN_PAGE_5 }}
          FB_TOKEN_PAGE_6: ${{ secrets.FB_TOKEN_PAGE_6 }}
          FB_TOKEN_PAGE_7: ${{ secrets.FB_TOKEN_PAGE_7 }}
          FB_TOKEN_PAGE_8: ${{ secrets.FB_TOKEN_PAGE_8 }}
          FB_TOKEN_PAGE_9: ${{ secrets.FB_TOKEN_PAGE_9 }}
          FB_TOKEN_PAGE_10: ${{ secrets.FB_TOKEN_PAGE_10 }}
          FB_TOKEN_PAGE_11: ${{ secrets.FB_TOKEN_PAGE_11 }}
          FB_TOKEN_PAGE_12: ${{ secrets.FB_TOKEN_PAGE_12 }}
          FB_TOKEN_PAGE_13: ${{ secrets.FB_TOKEN_PAGE_13 }}
          FB_TOKEN_PAGE_14: ${{ secrets.FB_TOKEN_PAGE_14 }}
          FB_TOKEN_PAGE_15: ${{ secrets.FB_TOKEN_PAGE_15 }}
          FB_TOKEN_PAGE_16: ${{ secrets.FB_TOKEN_PAGE_16 }}
          FB_TOKEN_PAGE_17: ${{ secrets.FB_TOKEN_PAGE_17 }}
          FB_TOKEN_PAGE_18: ${{ secrets.FB_TOKEN_PAGE_18 }}
          FB_TOKEN_PAGE_19: ${{ secrets.FB_TOKEN_PAGE_19 }}
          FB_TOKEN_PAGE_20: ${{ secrets.FB_TOKEN_PAGE_20 }}
          FB_TOKEN_PAGE_21: ${{ secrets.FB_TOKEN_PAGE_21 }}
          FB_TOKEN_PAGE_22: ${{ secrets.FB_TOKEN_PAGE_22 }}
          FB_TOKEN_PAGE_23: ${{ secrets.FB_TOKEN_PAGE_23 }}
          FB_TOKEN_PAGE_24: ${{ secrets.FB_TOKEN_PAGE_24 }}
          FB_TOKEN_PAGE_25: ${{ secrets.FB_TOKEN_PAGE_25 }}
          FB_TOKEN_PAGE_26: ${{ secrets.FB_TOKEN_PAGE_26 }}
          FB_TOKEN_PAGE_27: ${{ secrets.FB_TOKEN_PAGE_27 }}
          FB_TOKEN_PAGE_28: ${{ secrets.FB_TOKEN_PAGE_28 }}
          FB_TOKEN_PAGE_29: ${{ secrets.FB_TOKEN_PAGE_29 }}
          FB_TOKEN_PAGE_30: ${{ secrets.FB_TOKEN_PAGE_30 }}
        run: |
          python scripts/sync_dashboard_data.py || true

      - name: Persist SQLite Database & Dashboard State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ docs/data/ web/data/
          if [ -n "$(git status --porcelain data/ docs/data/ web/data/)" ]; then
            git commit -m "chore: update Facebook automation state & dashboard [skip ci]"
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase -X theirs origin/main && git push origin main && break || {
                git rebase --abort 2>/dev/null || true
                sleep 5
              }
            done
          else
            echo "No state changes to commit."
          fi

      - name: Upload Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
