name: Torres Matthew 4-Hour Automated Image Pipeline

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (do not post to Facebook)"
        required: false
        type: boolean
        default: false
      image_path:
        description: "Optional: Local image path to post directly"
        required: false
        type: string
        default: ""

  # Scheduled strictly every 4 hours (6 times daily):
  # 01:18, 05:18, 09:18, 13:18, 17:18, 21:18 UTC
  # Mathematically guaranteed ZERO-COLLISION with:
  # - All USA video reel uploads (:07, :27, :47)
  # - All UK video reel uploads (:01, :13, :25, :37, :49)
  # - Real-time Views Sync (:05 of even hours)
  # - Torres Matthew's own video reels (04:47, 13:47, 18:47, 23:47 UTC)
  schedule:
    - cron: "18 1,5,9,13,17,21 * * *"

concurrency:
  group: torres-image-upload
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload-image:
    name: Upload Image to Torres Matthew
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml google-api-python-client google-auth

      - name: Execute Torres Image Engine
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.image_path }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --local-image ${{ github.event.inputs.image_path }}"
          fi

          python scripts/post_torres_image.py $EXTRA_ARGS

      - name: Persist SQLite Database & Upload Records
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/posted_videos.db
          if [ -n "$(git status --porcelain data/posted_videos.db)" ]; then
            git commit -m "chore(photos): record Torres Matthew image upload [skip ci]"
            git pull --rebase origin main || true
            git push origin main || echo "Git push skipped or non-fast-forward"
          else
            echo "No database changes to commit."
          fi
